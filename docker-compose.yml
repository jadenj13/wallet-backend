services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: cmd/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      PARTY_URLS: '["http://party-0:3000","http://party-1:3000","http://party-2:3000"]'
      DB_PATH: /data/wallet.db
      JWT_SECRET: change-me-in-production
      DEVICE_SECRET: change-me-in-production
    volumes:
      - api-data:/data
    depends_on:
      - party-0
      - party-1
      - party-2

  party-0:
    build:
      context: .
      dockerfile: cmd/tss/Dockerfile
    ports:
      - "3001:3000"
    environment:
      PARTY_ID: "0"
      PEERS: '["http://party-1:3000","http://party-2:3000"]'
      REDIS_ADDR: redis:6379
    depends_on:
      - redis

  party-1:
    build:
      context: .
      dockerfile: cmd/tss/Dockerfile
    ports:
      - "3002:3000"
    environment:
      PARTY_ID: "1"
      PEERS: '["http://party-0:3000","http://party-2:3000"]'
      REDIS_ADDR: redis:6379
    depends_on:
      - redis

  party-2:
    build:
      context: .
      dockerfile: cmd/tss/Dockerfile
    ports:
      - "3003:3000"
    environment:
      PARTY_ID: "2"
      PEERS: '["http://party-0:3000","http://party-1:3000"]'
      REDIS_ADDR: redis:6379
    depends_on:
      - redis

volumes:
  api-data:
